<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오늘 먹을 저녁 메뉴 추천</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .card {
            background-color: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            width: 320px;
        }

        h1 {
            font-size: 1.5rem;
            color: #333;
            margin-bottom: 20px;
        }

        .emoji {
            font-size: 5rem;
            margin: 20px 0;
            height: 90px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .food-name {
            font-size: 1.5rem;
            font-weight: bold;
            color: #222;
            min-height: 36px;
            margin-bottom: 25px;
        }

        button {
            background-color: #ff5722;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1.1rem;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
            width: 100%;
        }

        button:hover {
            background-color: #e64a19;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>오늘 먹을 저녁 메뉴 추천</h1>
        <div class="emoji" id="emoji">❓</div>
        <div class="food-name" id="foodName">버튼을 눌러주세요</div>
        <button onclick="recommendMenu()">저녁 메뉴 추천</button>
    </div>

    <script>
        const menus = [
            { name: "삼겹살", emoji: "🥓" },
            { name: "치킨", emoji: "🍗" },
            { name: "피자", emoji: "🍕" },
            { name: "햄버거", emoji: "🍔" },
            { name: "초밥", emoji: "🍣" },
            { name: "라멘", emoji: "🍜" },
            { name: "짜장면", emoji: "🥢" },
            { name: "떡볶이", emoji: "🍢" },
            { name: "파스타", emoji: "🍝" },
            { name: "스테이크", emoji: "🥩" },
            { name: "마라탕", emoji: "🥘" },
            { name: "국밥", emoji: "🍲" }
        ];

        function recommendMenu() {
            const randomIndex = Math.floor(Math.random() * menus.length);
            const selected = menus[randomIndex];

            document.getElementById('emoji').innerText = selected.emoji;
            document.getElementById('foodName').innerText = selected.name;
        }
    </script>

</body>
</html>
